<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            /* margin: 0 30px; */
            text-align: center; 
        }
         h2{
            /* margin: 0 30px; */
            text-align: center;
            color: rgb(122, 141, 244); 
        }
        h3{
            /* margin: 0 30px; */
            text-align: center; 
            color: rgb(107, 110, 110);
        }
    </style>
</head>
<body>
    <h1>Building Pakistan's</h1>
    <h2>Tech Future</h2>
    <h3>Changing Lives. Building Careers. Shaping the Future.</h3>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script>
        // gsap.fromTo("h1, h2, h3",{
        //     x: 900,
        // },
        // {
        //     x: 300,
        //     duration: 2,
        // })

        let tl = gsap.timeline();

        tl.from("h1",{
            x: 500,
            duration: 3,
            opacity: 0.7,
        });
        tl.from("h2",{
            x: -500,
            duration: 3,
            opacity: 0.7,
        });
        tl.from("h3",{
            y: 500,
            duration: 3,
            opacity: 0.7,
        })


    </script>
</body>
</html>

        ///////////////// promise //////////////////
        // javaScript ka built-in constructor jo asynchronous operation ke result ko represnt kaerta hai.
        /// 3 states
        /// pending
        /// fulfiled
        /// reject

        ////.then() execute jb aap ka promise fulfiled ho ga.
        ////.catch() execute jb promise reject ho ga 
        ////.finally() succes ho ya na ho finally chle ga

        ////resolve operation succesful ho ga
        ////reject  jb operation reject


        let student = new Promise((resolve, reject)=>{
            let success = false;
            if(success){
                resolve("kaam ho gaya!")
            }else{
                reject("kaam nhi huwa")
            }
        })

        student.then((result)=>{
            console.log(result)
        }).catch((error)=>{
            console.log(error)
        }).finally(()=>{
            console.log("done")
        })
        
        /// promise chaining

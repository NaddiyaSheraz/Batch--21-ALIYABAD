<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Table</title>
</head>
<body>
    <table border="2" bgcolor="F2DCBF" cellspacing="5">
        <tr>
            <td bgcolor="CAF0C7">
                <table border="2" bgcolor="F7B0DD">
                    <tr>
                        <th colspan="2">Nested table</th>
                    </tr>
                    <tr>
                        <td>Row1 Col1</td>
                        <td>Row1 col2</td>
                    </tr>
                    <tr>
                        <td>row2col1</td>
                        <td>row2 col2</td>
                    </tr>
                </table>
            </td>
            <td bgcolor="C7F0EB">
                <table border="2" bgcolor="F7B0DD" cellpadding="10" cellspacing="5">
                    <tr>
                        <th colspan="2">Nested table</th>
                    </tr>
                    <tr>
                        <td>Row1 Col1</td>
                        <td>Row1 col2</td>
                    </tr>
                    <tr>
                        <td>row2col1</td>
                        <td>row2 col2</td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td bgcolor="99C0F2">
                <table border="2" bgcolor="F7B0DD">
                    <tr>
                        <th colspan="2">Nested table</th>
                    </tr>
                    <tr>
                        <td>Row1 Col1</td>
                        <td>Row1 col2</td>
                    </tr>
                    <tr>
                        <td>row2col1</td>
                        <td>row2 col2</td>
                    </tr>
                </table>
            </td>
            <td bgcolor="CB99F2">
                <table border="2" bgcolor="F7B0DD">
                    <tr>
                        <th colspan="2">Nested table</th>
                    </tr>
                    <tr>
                        <td>Row1 Col1</td>
                        <td>Row1 col2</td>
                    </tr>
                    <tr>
                        <td>row2col1</td>
                        <td>row2 col2</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>

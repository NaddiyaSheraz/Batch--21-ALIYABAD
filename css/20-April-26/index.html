<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <style>
        .container {
            height: 500px;
            width: 500px;
            background-color: gold;
            display: flex;
            flex-direction: row;
              
        }
        
        .container > .child1{
            height: 100px;
            width: 100px;
            background-color: darkgoldenrod;
           order: 2;
        }
        
        .container > .child2 {
            height: 100px;
            width: 100px;
            background-color: rgb(0, 255, 21);
           order: 0;
        }
        .container > .child3 {
            height: 100px;
            width: 100px;
            background-color: rgb(234, 0, 255);
           order: 3;
        }
        .container > .child4 {
            height: 100px;
            width: 100px;
            background-color: rgb(255, 81, 0);
           
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="child1">1</div>
        <div class="child2">2</div>
        <div class="child3">3</div>
        <div class="child4">4</div>
        <!-- <div class="child1"></div>
        <div class="child2"></div>
        <div class="child1"></div> -->
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Navbar</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

/* Navbar */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #333;
    padding: 10px 20px;
    color: white;
}

/* Logo */
.logo {
    font-size: 20px;
    font-weight: bold;
}

/* Menu */
.menu {
    display: flex;
    gap: 20px;
}

.menu a {
    color: white;
    text-decoration: none;
}

/* Toggle Button */
.toggle-label {
    display: none;
    font-size: 24px;
    cursor: pointer;
}

/* Hidden checkbox */
#menu-toggle {
    display: none;
}

/* Login toggle checkbox */
#login-toggle {
    display: none;
}

/* Login Button */
.login-btn {
    padding: 5px 10px;
    background: #00bcd4;
    border-radius: 5px;
}

/* When login checked */
#login-toggle:checked ~ .navbar .login-btn::after {
    content: " (Logged In)";
    color: lightgreen;
}

/* Mobile */
@media (max-width: 768px) {
    .menu {
        display: none;
        flex-direction: column;
        background: #444;
        position: absolute;
        top: 60px;
        right: 0;
        width: 200px;
        padding: 10px;
    }

    #menu-toggle:checked ~ .navbar .menu {
        display: flex;
    }

    .toggle-label {
        display: block;
    }
}
</style>
</head>

<body>

<!-- Menu Toggle -->
<input type="checkbox" id="menu-toggle">

<!-- Login Toggle -->
<!-- <input type="checkbox" id="login-toggle"> -->

<div class="navbar">
    <div class="logo">MySite</div>

    <label for="menu-toggle" class="toggle-label">☰</label>

    <div class="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>

        <!-- Login Toggle Button -->
        <!-- <label for="login-toggle" class="login-btn">Login</label> -->
    </div>
</div>

</body>
</html>
